<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS CRUD App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script defer src="app.js"></script>
</head>
<body>
    <div class="main">
        <div class="social-media-app">
            <h1>Social Media App</h1>
            <div class="sections">
                <div class="left">
                    <form class="form" novalidate>
                        <label for="input">Write your post here</label>
                        <input type="text" required placeholder="Type your heading" id="title" name="title">
                        <textarea name="text" id="input" cols="30" rows="5" placeholder="Type content here"></textarea>
                        <div class="form-message"></div>
                        <button id="post-btn" type="submit" class="btn">Post</button>
                    </form>
                </div>
                <div class="right">
                    <div>
                        <h2>Your Posts Here</h2>
                        <div id="posts"></div>
                    </div>
                    <div class="pagination"></div>
                </div>
            </div>
        </div>
        <div class="post-display">
            <h2></h2>
            <p></p>
            <button id="close" class="btn">Close</button>
        </div>
    </div>
</body>
</html>
